name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '27 13 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # region custom init part
      - name: Set up JDK
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: 'temurin'
      # endregion

      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # region custom build part
      - name: Setup gradle cache
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/loom-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradle permissions
        if: ${{ matrix.language == 'java-kotlin' }}
        run: chmod +x ./gradlew

      - name: Gradle build
        if: ${{ matrix.language == 'java-kotlin' }}
        env:
          GITHUB_PACKAGES_NAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x runGameTest --no-daemon --no-parallel -Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs=-Xmx3g
      # endregion

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df
        with:
          category: "/language:${{matrix.language}}"
