name: build
on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/loom-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradle permissions
        run: chmod +x ./gradlew

      - name: Gradle build
        env:
          GITHUB_PACKAGES_NAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew runDatagen
          ./gradlew build

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload build artifacts
        id: artifact-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 'build-jars'
          path: build/libs/

      - name: Notify webhook
        if: github.ref == 'refs/heads/master'
        run: |
          curl -X POST ${{ secrets.WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-auth: ${{ secrets.WEBHOOK_AUTH }}" \
            -d "{\"artifact-id\": \"${{ steps.artifact-upload.outputs.artifact-id }}\"}"

  client_game_test:
    runs-on: ubuntu-24.04
    # Backstop: the client gametest has no internal timeout and can hang indefinitely on a
    # software renderer, which previously burned an hour of runner time before manual cancellation.
    timeout-minutes: 30
    env:
      # The runner has no GPU and Xvfb offers no hardware acceleration, so use Mesa's llvmpipe.
      # Set at job level so the Gradle daemon (and the client JVM it forks) inherit it too.
      LIBGL_ALWAYS_SOFTWARE: '1'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/loom-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradle permissions
        run: chmod +x ./gradlew

      - name: Install software OpenGL
        # The runner image ships Xvfb but not Mesa's GLX/DRI stack. Without it Minecraft 26.3 fails
        # to create an OpenGL backend ("Couldn't find matching GLX visual"), fails Vulkan too
        # ("VK_KHR_surface") and then blocks instead of exiting - which previously hung the job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Verify software OpenGL under Xvfb
        # Fail fast with a readable error instead of letting a windowless client burn the timeout.
        run: xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B

      - name: Run client game tests
        env:
          GITHUB_PACKAGES_NAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `timeout` (rather than only the job timeout) keeps this step's failure explicit and lets
        # the `if: always()` screenshot upload below still run, so a hang stays diagnosable.
        run: |
          ./gradlew runDatagen
          timeout --kill-after=30s 20m ./gradlew runProductionClientGameTest

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 'test-screenshots'
          path: run/screenshots/
          if-no-files-found: warn