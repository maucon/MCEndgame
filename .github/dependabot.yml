# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

registries:
  github-maucon:
    type: maven-repository
    url: https://maven.pkg.github.com
    username: x-access-token
    password: ${{secrets.MAUCON_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - github-maucon
    schedule:
      interval: "weekly"
    labels:
      - "dependency"
    commit-message:
      prefix: ""
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependency
    commit-message:
      prefix: ""
      include: scope